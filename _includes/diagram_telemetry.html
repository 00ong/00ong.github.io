<div class="diagram-container">
  <h4>Data Flow: Default OS vs. 00.ong Hardened</h4>
  <svg viewBox="0 0 700 180" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" style="max-width:700px;">
    <!-- Flow 1: Default Windows 11 (Unprotected) -->
    <g transform="translate(20, 25)">
      <!-- Source Box -->
      <rect x="0" y="0" width="160" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="80" y="29" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Default Windows 11</text>
      
      <!-- Arrow Line -->
      <line x1="170" y1="24" x2="310" y2="24" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="308,20 316,24 308,28" fill="#ef4444"/>
      <text x="240" y="16" text-anchor="middle" fill="#ef4444" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Telemetry Logs</text>

      <!-- Target Cloud Box -->
      <rect x="320" y="0" width="160" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
      <text x="400" y="29" text-anchor="middle" fill="#dc2626" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Diagnostic Cloud</text>
    </g>

    <!-- Flow 2: 00.ong Hardened (Protected) -->
    <g transform="translate(20, 105)">
      <!-- Source Box -->
      <rect x="0" y="0" width="160" height="48" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
      <text x="80" y="29" text-anchor="middle" fill="#059669" font-family="system-ui, sans-serif" font-weight="700" font-size="13">00.ong Hardened</text>
      
      <!-- Blocked Line -->
      <line x1="170" y1="24" x2="235" y2="24" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="245" cy="24" r="10" fill="#ef4444"/>
      <text x="245" y="28" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="11">✕</text>
      
      <!-- Blocked Target Box -->
      <rect x="320" y="0" width="160" height="48" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="400" y="29" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Blocked / Isolated</text>
    </g>

    <!-- Side Summary Pill Card -->
    <g transform="translate(520, 25)">
      <rect x="0" y="0" width="160" height="128" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="80" y="32" text-anchor="middle" fill="#0055ff" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="0.05em">00.ONG SHIELD</text>
      <line x1="20" y1="45" x2="140" y2="45" stroke="#e2e8f0" stroke-width="1"/>
      <text x="80" y="72" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="700" font-size="13">100% Private</text>
      <text x="80" y="94" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Zero Tracking</text>
    </g>
  </svg>
  <p style="font-size: 0.85rem; color: var(--color-text-soft, #64748b); margin-top: 0.75rem; margin-bottom: 0;">Figure 1: Comparison between default operating system diagnostic transmission vs. 00.ong network isolation.</p>
