<div class="tldr-verdict">
  <div class="tldr-verdict-header">
    <div class="tldr-verdict-badge">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>00.ong Verdict</span>
    </div>
    <span class="tldr-verdict-tag">TL;DR</span>
  </div>
  <div class="tldr-verdict-grid">
    <div class="tldr-card">
      <span class="tldr-label">WHAT IT IS</span>
      <p class="tldr-text">{{ include.what }}</p>
    </div>
    <div class="tldr-card">
      <span class="tldr-label">WHY IT MATTERS</span>
      <p class="tldr-text">{{ include.why }}</p>
    </div>
    <div class="tldr-card tldr-action">
      <span class="tldr-label">RECOMMENDED TOOL</span>
      <a href="{{ include.link_url }}" target="_blank" rel="noopener" class="tldr-btn">
        <span>{{ include.pick }}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</div>
