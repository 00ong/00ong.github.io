<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 9" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="14" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="14" height="9" fill="#0f151a" rx="1" ry="1"/>

  <!-- left 0 outline -->
  <g fill="url(#accent)">
    <rect x="1" y="1" width="5" height="1"/>
    <rect x="1" y="7" width="5" height="1"/>
    <rect x="1" y="2" width="1" height="5"/>
    <rect x="5" y="2" width="1" height="5"/>
  </g>

  <!-- right 0 outline -->
  <g fill="url(#accent)">
    <rect x="8" y="1" width="5" height="1"/>
    <rect x="8" y="7" width="5" height="1"/>
    <rect x="8" y="2" width="1" height="5"/>
    <rect x="12" y="2" width="1" height="5"/>
  </g>

  <!-- inner corner pixels for definition -->
  <g fill="#93a7ff" opacity="0.75">
    <rect x="2" y="2" width="1" height="1"/>
    <rect x="4" y="2" width="1" height="1"/>
    <rect x="2" y="6" width="1" height="1"/>
    <rect x="4" y="6" width="1" height="1"/>
    <rect x="9" y="2" width="1" height="1"/>
    <rect x="11" y="2" width="1" height="1"/>
    <rect x="9" y="6" width="1" height="1"/>
    <rect x="11" y="6" width="1" height="1"/>
  </g>
</svg>
